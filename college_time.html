<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Time Table</title>
</head>
<body>
    <table border="1">
        <caption>College Time Table</caption>
        <thead>
            <tr>
                <th>Day/Time</th>
                <th>9:00-10:00</th>
                <th>10:00-11:00</th>
                <th>11:00-12:00</th>
                <th>12:00-1:00</th>
                <th>1:00-2:00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>JavaScript</td>
                <td rowspan="5" align="center">Lunch</td>
                <td>SQL</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Python</td>
                <td>Java</td>
                <td>JavaScript</td>
                <td>DBMS</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>HTML</td>
                <td colspan="2" align="center">Lab</td>
                <td>SQL</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>Python</td>
                <td>CSS</td>
                <td>Java</td>
                <td>Project</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td colspan="3" align="center">Seminar</td>
                <td>Project</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
