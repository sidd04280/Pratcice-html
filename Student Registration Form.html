<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
<br/>
<br/>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
<br/>
<br/>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
<br/>
<br/>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter Your Age" required>
<br/>
<br/>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
<br/>
<br/>
        <label for="contact">Contact Number:</label>
        <input type="tel" id="contact" placeholder="Enter Your Contact Number" required>
<br/>
<br/>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio"  name="gender" value="female">Female
        <input type="radio"  name="gender" value="other">Other
<br/>
<br/>
       <label for="course">Course:</label>
        <select id="course" name="course" required> 
            <option value="Full Stack Developer">Full Stack Developer</option>
            <option value="Data Science">Data Science</option>
            <option value="Data Analysis">Data Analysis</option>
            <option value="JavaScript">JavaScript</option>
        </select>
<br/>
<br/>
            <!-- i made small mistake like <input type="checkbox" name="skills" value="HTML">HTML
            This works, but for accessibility it's better to connect each checkbox to a label
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label> -->

        <label for="skills">Skills:</label>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>
<br/>
<br/>
        <label for="address">Address:</label>
        <textarea id="address" placeholder="Enter Your Address" required></textarea>  
        
<br/>
<br/>
        <input type="submit">
        <input type="reset">
    </form>
</body>
</html>


                <!-- 🎤 Interview question
                What's the difference between id, name, and for?
                A good fresher answer:
                id uniquely identifies an HTML element. 
                for in a label connects the label to an input's id. 
                name identifies the form field when its value is submitted.

                That's an important interview question, so remember it. -->
