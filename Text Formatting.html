<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <b>Bold Text</b>
    <br>
    <i>Italic Text</i>
    <br>
    <u>Underlined Text</u>
    <br>
    <p>Price: <del>$100</del> $800</p>
    <br>
    <p>My Favorite language is <ins>Python</ins></p>
    <br>
    <p>Water: H<sub>2</sub>O</p>
    <br>
    <p>2<sup>2</sup> = 4</p>
</body>
</html>
