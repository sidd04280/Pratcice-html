<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure and Image</title>
</head>
<body>
    <header>
        <h1>Product Page</h1>
    </header>
    <figure>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT28u9klF6NPQFyh6AAeJ8sJeyJh21CGVqI_RXD_Tq3lg&s=10" alt="Black Hp Omen viewed from front">
    <figcaption><h3>Premium Black Laptop</h3></figcaption>
    </figure>

    <fieldset>
        <legend><h4>Product description</h4></legend>
        <p>Original Price : <del>$60,000</del></p>
        <p>Discounted Price: <ins> $49,999</ins></p>
    </fieldset>
<br/>
    <button type="submit">Buy Now</button>

</body>
</html>



<!-- You understand the new tags well. Remember these meanings:
Tag	                  Purpose
<figure>	      Groups an image or other self-contained content
<img>	          Displays an image
<figcaption>	  Adds a caption
<del>	          Marks deleted text, commonly shown with a strikethrough
<ins>	          Marks inserted text, commonly shown with an underline -->
