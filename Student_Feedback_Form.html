<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>
</head>
<body>
  <form>
    <fieldset>
        <legend>Student Feedback Form</legend>
        <br/>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br/>
        <br/>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br/>
        <br/>
        <label for="registration number">Registration Number:</label>
        <input type="text" id="registration number" name="registration number" required>
        <br/>
        <br/>
        <label for="courses">Courses:</label>
        <select id="courses" name="courses" required>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="ise">ISE</option>
            <option value="aiml">AIMl</option>
        </select>
        <br/>
        <br/>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br/>
        <br/>
        <label for="feedback">Feedback:</label>
        <textarea id="feedback" name="feedback" rows="4" cols="50" required></textarea>
        <br/>
        <br/>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
        <br/>
        <br/>
        <input type="submit" value="submit">
    </fieldset>

  </form>

</body>
</html>
